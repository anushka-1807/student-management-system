<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="mb-0">Course Details</h2>
                    <p class="text-muted mb-0" style="font-size:.85rem;margin-top:2px;">Detailed view of course specifications and status</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/course/list}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back to List
                    </a>
                    <a th:href="@{/course/{id}/edit(id=${course.id})}" class="btn btn-warning">
                        <i class="bi bi-pencil"></i> Edit Course
                    </a>
                </div>
            </div>

            <div class="card" style="max-width:760px;">
                <div class="card-header">
                    <i class="bi bi-journal-bookmark-fill"></i> Course Information
                </div>
                <div class="card-body">
                    <!-- Top header row with title, code, and status -->
                    <div class="d-flex justify-content-between align-items-start mb-4 pb-3 border-bottom flex-wrap gap-2">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <h3 class="mb-0 fw-bold" style="font-size:1.4rem;" th:text="${course.courseName}"></h3>
                                <code style="background:rgba(99,102,241,.1);color:var(--primary);padding:3px 10px;border-radius:6px;font-size:.85rem;font-weight:700;"
                                      th:text="${course.courseCode}"></code>
                            </div>
                            <span class="text-muted small">Course ID: #<span th:text="${course.id}"></span></span>
                        </div>
                        <div>
                            <span class="badge-pill badge-active" th:if="${course.active}" style="padding:6px 14px;font-size:.8rem;">
                                <i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Active Course
                            </span>
                            <span class="badge-pill badge-inactive" th:unless="${course.active}" style="padding:6px 14px;font-size:.8rem;">
                                <i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Inactive Course
                            </span>
                        </div>
                    </div>

                    <!-- Details grid -->
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <div class="info-box">
                                <div class="info-label mb-1">
                                    <i class="bi bi-cash-stack text-primary me-1"></i> Course Tuition Fee
                                </div>
                                <div class="info-value text-primary" style="font-size:1.25rem;" th:text="'₹' + ${#numbers.formatDecimal(course.fee, 1, 'COMMA', 2, 'POINT')}">₹0.00</div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="info-box">
                                <div class="info-label mb-1">
                                    <i class="bi bi-clock-history text-primary me-1"></i> Program Duration
                                </div>
                                <div class="info-value" style="font-size:1.25rem;" th:text="${course.duration}">—</div>
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-2">
                        <h6 class="fw-bold text-secondary mb-2" style="font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;">Course Overview</h6>
                        <div class="p-3 bg-light rounded-3 border" style="font-size:.9rem;line-height:1.6;color:var(--text-secondary);" th:text="${course.description ?: 'No description provided for this course.'}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
