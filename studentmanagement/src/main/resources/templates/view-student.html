<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="mb-0">Student Profile</h2>
                    <p class="text-muted mb-0" style="font-size:.85rem;margin-top:2px;">Complete student registration details</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/students/list}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back to List
                    </a>
                    <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-warning">
                        <i class="bi bi-pencil"></i> Edit Student
                    </a>
                </div>
            </div>

            <div class="card" style="max-width:760px;">
                <div class="card-header">
                    <i class="bi bi-person-lines-fill"></i> Student Information
                </div>
                <div class="card-body">
                    <!-- Student Identity Header -->
                    <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom flex-wrap gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.35rem;font-weight:700;flex-shrink:0;box-shadow:0 4px 14px rgba(99,102,241,.3);"
                                 th:text="${#strings.substring(student.firstName,0,1)}">A</div>
                            <div>
                                <h3 class="mb-0 fw-bold" style="font-size:1.35rem;" th:text="|${student.firstName} ${student.lastName}|"></h3>
                                <div class="text-muted small">Student ID: #<span th:text="${student.id}"></span></div>
                            </div>
                        </div>
                        <div>
                            <span class="badge-pill badge-active" th:if="${student.active}" style="padding:6px 14px;font-size:.8rem;">
                                <i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Active Student
                            </span>
                            <span class="badge-pill badge-inactive" th:unless="${student.active}" style="padding:6px 14px;font-size:.8rem;">
                                <i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Inactive Student
                            </span>
                        </div>
                    </div>

                    <!-- Details grid -->
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <div class="info-box">
                                <div class="info-label mb-1">
                                    <i class="bi bi-envelope text-primary me-1"></i> Email Address
                                </div>
                                <div class="info-value" style="font-size:.95rem;word-break:break-all;" th:text="${student.email}">student@example.com</div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="info-box">
                                <div class="info-label mb-1">
                                    <i class="bi bi-telephone text-primary me-1"></i> Phone Number
                                </div>
                                <div class="info-value" style="font-size:.95rem;" th:text="${student.phoneNumber ?: 'Not provided'}">+1 234 567 8900</div>
                            </div>
                        </div>
                    </div>

                    <!-- Address box -->
                    <div class="mb-2">
                        <h6 class="fw-bold text-secondary mb-2" style="font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;">
                            <i class="bi bi-geo-alt me-1 text-primary"></i> Residential Address
                        </h6>
                        <div class="p-3 bg-light rounded-3 border" style="font-size:.9rem;line-height:1.6;color:var(--text-secondary);" th:text="${student.address ?: 'No address provided.'}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
