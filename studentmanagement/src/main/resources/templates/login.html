<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">

    <div class="login-card">

        <!-- Header -->
        <div class="login-header text-white">
            <div class="brand-icon-lg">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h2 class="mb-1 fw-bold" style="font-size:1.5rem;">Student Management</h2>
            <p class="mb-0" style="opacity:.7;font-size:.85rem;">Sign in to your admin account</p>
        </div>

        <!-- Body -->
        <div class="card-body">

            <h4 class="text-center mb-4 fw-bold">Welcome Back 👋</h4>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Invalid username or password. Please try again.
            </div>

            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                You have been logged out successfully.
            </div>

            <div th:if="${message}" class="alert alert-danger" role="alert" th:text="${message}"></div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label for="username" class="form-label">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text"
                               class="form-control border-start-0 ps-0"
                               id="username"
                               name="username"
                               placeholder="Enter your username"
                               autocomplete="username"
                               required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password"
                               class="form-control border-start-0 ps-0"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:.95rem;">
                    <i class="bi bi-arrow-right-circle"></i> Sign In
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
