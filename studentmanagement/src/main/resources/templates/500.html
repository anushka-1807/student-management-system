<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="login-body">
    <div class="login-card text-center" style="max-width:520px;padding:48px 36px;">
        <div style="width:72px;height:72px;border-radius:20px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--danger);font-size:2rem;box-shadow:0 8px 24px rgba(239,68,68,.2);">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <h1 class="fw-bold mb-1" style="font-size:4rem;background:linear-gradient(135deg,#f87171,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;">
            500
        </h1>
        <h3 class="fw-bold text-white mb-2">Internal Server Error</h3>
        <p class="text-white-50 mb-4" style="font-size:.95rem;line-height:1.6;">
            Something unexpected occurred on our end while processing your request. Please try again or return to the dashboard.
        </p>

        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/dashboard}" class="btn btn-primary" style="padding:10px 24px;">
                <i class="bi bi-house-door"></i> Back to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
