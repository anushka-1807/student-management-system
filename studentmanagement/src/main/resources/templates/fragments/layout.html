<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- ══ SIDEBAR ═══════════════════════════════════════════════ -->
<div th:fragment="sidebar" id="sidebar-wrapper">

    <!-- Brand -->
    <div class="sidebar-heading">
        <div class="brand-icon">
            <i class="bi bi-mortarboard-fill text-white"></i>
        </div>
        <span>SMS Admin</span>
    </div>

    <!-- Nav links -->
    <div class="list-group list-group-flush">

        <a th:href="@{/dashboard}" class="sidebar-link">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/students/list}" class="sidebar-link">
            <i class="bi bi-people"></i>
            <span>Students</span>
        </a>

        <a th:href="@{/course/list}" class="sidebar-link">
            <i class="bi bi-journal-bookmark"></i>
            <span>Courses</span>
        </a>

        <a th:href="@{/enrollments/enrollmentList}" class="sidebar-link">
            <i class="bi bi-person-check"></i>
            <span>Enrolled Students</span>
        </a>

        <a th:href="@{/enrollments/showEnroll}" class="sidebar-link">
            <i class="bi bi-plus-circle"></i>
            <span>Enroll to Course</span>
        </a>

        <!-- Spacer pushes logout to bottom -->
        <div style="flex:1"></div>

        <!-- Logout -->
        <form method="post" th:action="@{/logout}" class="sidebar-link logout-link mt-auto" style="padding-bottom:14px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" style="background:none;border:none;color:inherit;font:inherit;font-size:.875rem;font-weight:500;display:flex;align-items:center;gap:12px;padding:0;cursor:pointer;width:100%;">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>
        </form>

    </div>
</div>

<!-- ══ TOP NAVBAR ════════════════════════════════════════════ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg border-bottom">
    <div class="container-fluid" style="padding:0 20px;">

        <!-- Sidebar toggle -->
        <button id="sidebarToggle" title="Toggle sidebar">
            <i class="bi bi-list"></i>
        </button>

        <!-- Right: user chip -->
        <div class="topbar-user">
            <div class="topbar-avatar">A</div>
            <div>
                <div class="topbar-label">Admin</div>
                <div class="topbar-sublabel">Administrator</div>
            </div>
        </div>

    </div>
</nav>

<!-- ══ FOOTER ════════════════════════════════════════════════ -->
<footer th:fragment="footer" class="py-4 bg-light mt-auto border-top">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between small">
            <div class="text-muted">&copy; 2026 Student Management System</div>
            <div>
                <a href="#">Privacy Policy</a>
                &middot;
                <a href="#">Terms &amp; Conditions</a>
            </div>
        </div>
    </div>
</footer>

<!-- ══ SCRIPTS ════════════════════════════════════════════════ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('sidebarToggle');
            if (toggle) {
                toggle.addEventListener('click', e => {
                    e.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }

            // Highlight active sidebar link
            const links = document.querySelectorAll('.sidebar-link');
            const path  = window.location.pathname;
            links.forEach(link => {
                const href = link.getAttribute('href') || link.getAttribute('th:href') || '';
                if (href && path.startsWith(href) && href !== '/') {
                    link.classList.add('active');
                } else if (href === '/dashboard' && path === '/dashboard') {
                    link.classList.add('active');
                }
            });
        });
    </script>
</th:block>

</body>
</html>
