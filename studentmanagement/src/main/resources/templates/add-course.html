<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="mb-0">Add New Course</h2>
                    <p class="text-muted mb-0" style="font-size:.85rem;margin-top:2px;">Fill in the details below to register a new course</p>
                </div>
                <a th:href="@{/course/list}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to List
                </a>
            </div>

            <div class="card" style="max-width:740px;">
                <div class="card-header">
                    <i class="bi bi-journal-plus"></i> Course Information
                </div>
                <div class="card-body">
                    <form th:action="@{/course}" th:object="${courseDto}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3 mb-3">
                            <div class="col-md-7">
                                <label for="courseName" class="form-label">Course Name <span style="color:var(--danger)">*</span></label>
                                <input type="text"
                                       id="courseName"
                                       th:field="*{courseName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('courseName')} ? 'is-invalid' : ''"
                                       placeholder="e.g. Full Stack Web Development" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}"></div>
                            </div>
                            <div class="col-md-5">
                                <label for="courseCode" class="form-label">Course Code <span style="color:var(--danger)">*</span></label>
                                <input type="text"
                                       id="courseCode"
                                       th:field="*{courseCode}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid' : ''"
                                       placeholder="e.g. CS-101" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}"></div>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="duration" class="form-label">Duration <span style="color:var(--danger)">*</span></label>
                                <input type="text"
                                       id="duration"
                                       th:field="*{duration}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid' : ''"
                                       placeholder="e.g. 6 Months" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="fee" class="form-label">Course Fee (₹) <span style="color:var(--danger)">*</span></label>
                                <input type="number"
                                       id="fee"
                                       step="0.01"
                                       min="0"
                                       th:field="*{fee}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('fee')} ? 'is-invalid' : ''"
                                       placeholder="e.g. 15000" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fee')}" th:errors="*{fee}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control"
                                      id="description"
                                      rows="4"
                                      th:field="*{description}"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                      placeholder="Provide an overview of the curriculum, objectives, and prerequisites..."></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="reset" class="btn btn-secondary">
                                <i class="bi bi-arrow-counterclockwise"></i> Reset
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2-circle"></i> Save Course
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
