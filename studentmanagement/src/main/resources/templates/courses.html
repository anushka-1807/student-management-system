<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="mb-0">Courses</h2>
                    <p class="text-muted mb-0" style="font-size:.85rem;margin-top:2px;">Manage all available courses</p>
                </div>
                <a th:href="@{/course/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Add New Course
                </a>
            </div>

            <div th:if="${message}" class="alert alert-success" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${message}"></span>
            </div>

            <div class="card">
                <div class="card-header">
                    <i class="bi bi-journal-bookmark"></i> Course List
                </div>
                <div class="card-body p-0">
                    <div class="text-muted p-4" th:if="${courses.content.isEmpty()}">
                        <i class="bi bi-inbox me-2"></i>No courses found. Add your first course!
                    </div>
                    <div class="table-responsive" th:if="${!courses.content.isEmpty()}">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Course Name</th>
                                    <th>Code</th>
                                    <th>Fee</th>
                                    <th>Duration</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="course : ${courses.content}">
                                    <td data-label="ID" th:text="${course.id}"></td>
                                    <td data-label="Course Name">
                                        <div style="font-weight:600;" th:text="${course.courseName}"></div>
                                    </td>
                                    <td data-label="Code">
                                        <code style="background:rgba(99,102,241,.08);color:var(--primary);padding:2px 8px;border-radius:5px;font-size:.8rem;font-weight:600;"
                                              th:text="${course.courseCode}"></code>
                                    </td>
                                    <td data-label="Fee" th:text="'₹' + ${course.fee}"></td>
                                    <td data-label="Duration" th:text="${course.duration}"></td>
                                    <td data-label="Status">
                                        <span class="badge-pill badge-active" th:if="${course.active}"><i class="bi bi-circle-fill" style="font-size:.45rem;"></i> Active</span>
                                        <span class="badge-pill badge-inactive" th:unless="${course.active}"><i class="bi bi-circle-fill" style="font-size:.45rem;"></i> Inactive</span>
                                    </td>
                                    <td data-label="Actions">
                                        <div class="d-flex gap-1">
                                            <a th:href="@{'/course/' + ${course.id}}"
                                               class="btn btn-sm btn-info" title="View">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/course/{id}/edit(id=${course.id})}"
                                               class="btn btn-sm btn-warning" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="px-4 py-3 border-top" th:if="${courses.totalPages > 1}">
                        <nav aria-label="Course pagination">
                            <ul class="pagination justify-content-end mb-0">
                                <li class="page-item" th:classappend="${courses.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{'/course/list'(page=${courses.number > 0 ? courses.number-1 : 0}, size=${courses.size})}">
                                        <i class="bi bi-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item"
                                    th:each="pageNum : ${#numbers.sequence(0, courses.totalPages-1)}"
                                    th:classappend="${pageNum} == ${courses.number} ? 'active' : ''">
                                    <a class="page-link"
                                       th:href="@{'/course/list'(page=${pageNum}, size=${courses.size})}"
                                       th:text="${pageNum + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${courses.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{'/course/list'(page=${courses.last ? courses.number : courses.number+1}, size=${courses.size})}">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
